name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trilha
          POSTGRES_PASSWORD: trilha_ci
          POSTGRES_DB: trilha_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trilha -d trilha_crm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://trilha:trilha_ci@localhost:5432/trilha_crm_test
      TEST_DATABASE_URL: postgres://trilha:trilha_ci@localhost:5432/trilha_crm_test

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Testes E2E
        run: pnpm test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Auditoria de dependências de produção
        run: pnpm audit --prod --audit-level high
