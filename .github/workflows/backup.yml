name: Backup do banco

# Backup diário do Neon (produção), criptografado, guardado como artifact privado do repositório.
# Ativação: secrets PROD_DATABASE_URL_UNPOOLED e BACKUP_PASSPHRASE + variável BACKUP_ENABLED=true (ver docs/deployment.md)
on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Alerta antes de chegar ao limite de 0,5 GB do Neon Free
      STORAGE_ALERT_BYTES: "400000000"

    steps:
      - name: Conferir segredos
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Configure os secrets PROD_DATABASE_URL_UNPOOLED e BACKUP_PASSPHRASE."
            exit 1
          fi

      # pg_dump precisa ser da mesma versão do servidor ou mais nova
      - name: Gerar dump
        run: |
          docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' > backup.dump
          test -s backup.dump
          ls -lh backup.dump

      - name: Criptografar
        run: |
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "trilha-crm-$(date -u +%Y-%m-%d).dump.gpg" backup.dump
          shred -u backup.dump

      - uses: actions/upload-artifact@v7
        with:
          name: backup-${{ github.run_id }}
          path: trilha-crm-*.dump.gpg
          retention-days: 14
          if-no-files-found: error

      - name: Verificar uso de armazenamento
        run: |
          size=$(docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'psql "$DATABASE_URL" -tAc "select pg_database_size(current_database())"')
          echo "Tamanho do banco: $size bytes"
          if [ "$size" -gt "$STORAGE_ALERT_BYTES" ]; then
            echo "::error::Banco com $size bytes — perto do limite de 0,5 GB do Neon Free. Veja docs/deployment.md."
            exit 1
          fi
