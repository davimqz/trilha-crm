# Ambiente local de desenvolvimento. Não usar estas credenciais fora da máquina local.
name: trilha-crm
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trilha
      POSTGRES_PASSWORD: trilha_dev
      POSTGRES_DB: trilha_crm
    ports:
      # Exposto só em localhost para não abrir o banco na rede
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trilha -d trilha_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
